<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f3a68" />
    <script>
      // Tema antes da primeira pintura (padrão claro), para não piscar escuro em quem usa o claro.
      try {
        var t = localStorage.getItem('finapp.theme') || 'light';
        if (t !== 'system') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="Controle financeiro: saldo, o que vence e o que vai sobrar."
    />
    <meta name="apple-mobile-web-app-title" content="FinApp" />
    <title>FinApp</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
