# Produção. Uso (a partir da raiz do repositório):
#   cp infra/.env.example infra/.env   # e preencher
#   docker compose -f infra/docker-compose.yml up -d --build
name: finapp-prod

services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: finapp-api:latest
    container_name: finapp-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TZ: America/Sao_Paulo
    ports:
      # O cloudflared roda no host (systemd), então a API é publicada só no
      # loopback. A porta 3000 do host já é usada pelo voleidraft.
      - '127.0.0.1:${FINAPP_HOST_PORT:-3010}:3000'
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: finapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Sao_Paulo
    # Sem porta publicada: só a API alcança o banco, pela rede interna.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  backup:
    build: ./backup
    image: finapp-backup:latest
    container_name: finapp-backup
    hostname: finapp-backup
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      # Padrão: repositório local montado em /repo. Para backup externo, troque
      # RESTIC_REPOSITORY no .env (ex.: b2:bucket:finapp, rclone:remoto:finapp).
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/repo}
      # Cópia externa do repositório local (ver docs/arquitetura.md › Backup).
      RCLONE_CONFIG: /config/rclone/rclone.conf
      TZ: America/Sao_Paulo
    volumes:
      - ${BACKUP_LOCAL_DIR:-/srv/finapp-backups/restic}:/repo
      - ${RCLONE_CONFIG_DIR:-/srv/finapp-backups/rclone}:/config/rclone
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
