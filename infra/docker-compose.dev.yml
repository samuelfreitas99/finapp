# Desenvolvimento: só o Postgres, acessível apenas pela máquina local.
# Uso: docker compose -f infra/docker-compose.dev.yml up -d
# Nome de projeto "finapp-dev" para não misturar com containers antigos do
# projeto "finapp" que já existem (parados) no servidor.
name: finapp-dev

services:
  db:
    image: postgres:17-alpine
    container_name: finapp-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: finapp
      POSTGRES_PASSWORD: finapp
      POSTGRES_DB: finapp
      TZ: America/Sao_Paulo
    ports:
      # 5432 fica livre para outros projetos do servidor.
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U finapp -d finapp']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
